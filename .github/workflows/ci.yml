name: CI
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
permissions:
  contents: read
jobs:
  verify:
    name: Quality and npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3' # Bundles npm 11.19.1
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit all npm dependencies (including development)
        run: |
          npm audit --audit-level=low
          echo '### npm audit: passed (all severity levels, including development dependencies)' >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: Semgrep CE SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull pinned Community Edition image
        run: docker pull "$SEMGREP_IMAGE"
      - name: Verify positive and negative SAST rule fixtures
        run: |
          docker run --rm --network none --entrypoint semgrep \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            "$SEMGREP_IMAGE" scan --metrics=off --disable-version-check \
            --test --config .semgrep/security.yml .semgrep/security.tsx
      - name: Scan application source (fail on findings or scanner errors)
        run: |
          docker run --rm --network none --entrypoint semgrep \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/src \
            --volume "$GITHUB_WORKSPACE:/src:ro" --volume "$RUNNER_TEMP:/reports" --workdir /src \
            "$SEMGREP_IMAGE" scan --config .semgrep/security.yml \
            --error --strict --metrics=off --disable-version-check \
            --max-lines-per-finding=0 --json-output=/reports/semgrep.json src
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'semgrep.json')) as report:
              result = json.load(report)
          scanned = result.get('paths', {}).get('scanned', [])
          assert any(path.endswith(('.ts', '.tsx')) for path in scanned), 'No application source scanned'
          assert not result.get('errors'), 'SAST returned scanner errors'
          assert not result.get('results'), 'SAST returned findings'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Semgrep CE 1.186.0: {len(scanned)} files scanned, 0 findings, 0 errors\n')
          PY

  secrets:
    name: Gitleaks secrets (full Git history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks CLI (no licensed Action)
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION"
          mkdir -p "$tool_dir"
          archive="$tool_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Scan all fetched history with fully redacted findings
        run: |
          gitleaks git --log-opts="--all" --redact=100 --no-banner --exit-code=1 .
          echo '### Gitleaks 8.30.1: passed, 0 secret findings in full fetched Git history' >> "$GITHUB_STEP_SUMMARY"
